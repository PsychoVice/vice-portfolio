<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101012">
  <meta name="description" content="VICE — концертные проекты и live-фотография.">
  <title>VICE — Концертные съёмки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261118-10">
  <style>
    .case-page{min-height:calc(100svh - 86px);padding:7vw 8vw 8vw}
    .case-back{display:inline-flex;align-items:center;gap:14px;color:#aaa5a2;font-size:10px;font-weight:800;letter-spacing:.14em;transition:color .2s}
    .case-back:hover{color:#fff}
    .case-kicker{margin-top:90px;color:#bd5267;font-size:10px;font-weight:800;letter-spacing:.2em}
    .case-title{margin:22px 0 18px;font:500 clamp(54px,10vw,130px)/.95 var(--display);letter-spacing:-.025em;text-transform:uppercase}
    
    .concert-projects{margin-top:65px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(22px,3vw,44px)}
    .concert-project{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:clamp(14px,2vw,26px);min-width:0;padding-bottom:24px;border-bottom:1px solid rgba(255,255,255,.14)}
    .concert-poster{width:100%;display:flex;justify-content:center;align-items:center}
    .concert-poster img{display:block;width:100%;height:auto;max-height:340px;object-fit:contain;transition:transform .35s ease,opacity .3s ease}
    .concert-project:hover .concert-poster img{transform:scale(1.015);opacity:.88}
    .concert-project-copy{min-width:0}
    .concert-project-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .concert-project-title h2{margin:0;font:500 clamp(27px,3vw,48px)/1.05 var(--display);text-transform:uppercase}
    .concert-project-title span{color:#bd5267;font-size:22px;transition:transform .25s}
    .concert-project:hover .concert-project-title span{transform:translate(4px,-4px)}
    
    .case-footer{margin:0 8vw 30px;padding-top:20px;border-top:1px solid rgba(255,255,255,.16);display:flex;justify-content:space-between;align-items:center;color:#aaa5a2;font-size:9px;letter-spacing:.14em}
    @media(max-width:900px){.concert-projects{grid-template-columns:1fr;gap:34px}.concert-project{grid-template-columns:minmax(160px,280px) minmax(0,1fr);gap:clamp(24px,5vw,55px)}.concert-poster img{max-height:400px}}
    @media(max-width:650px){.case-page{padding:8vw 7vw 16vw}.case-kicker{margin-top:75px}.concert-project{grid-template-columns:minmax(105px,38%) minmax(0,1fr);gap:20px;padding-bottom:30px}.concert-poster img{max-height:300px}.concert-project-title h2{font-size:clamp(26px,7vw,38px)}.concert-project-title span{font-size:19px}.case-footer{margin-left:7vw;margin-right:7vw}}
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="VICE — на главную"><img class="site-logo" src="images/%D0%BB%D0%BE%D0%B3%D0%BE%20%D0%B1%D0%B5%D0%B7%20%D1%84%D0%BE%D0%BD%D0%B0.png" alt="VICE"></a>
    <a class="header-cta" href="index.html#works">ВСЕ ПРОЕКТЫ <span>↗</span></a>
  </header>
  <main class="case-page">
    <a class="case-back" href="index.html#works">← НАЗАД К ПРОЕКТАМ</a>
    <div class="case-kicker">01 / LIVE PHOTOGRAPHY</div>
    <h1 class="case-title">Концертные съёмки</h1>
    
    <section class="concert-projects" aria-label="Концертные проекты">
      <a class="concert-project" href="hallowen-fest.html">
        <div class="concert-poster"><img src="images/projects/concerts/Hallowen%20fest/%D0%B0%D1%84%D0%B8%D1%88%D0%B0%20hallowen%20fest.webp" alt="Афиша Hallowen Fest"></div>
        <div class="concert-project-copy">
          <div class="concert-project-title"><h2>Hallowen Fest</h2><span>↗</span></div>
          
        </div>
      </a>
      <a class="concert-project" href="index-event.html">
        <div class="concert-poster"><img src="images/projects/concerts/INDEX/%D0%90%D0%A4%D0%98%D0%A8%D0%90%20%D0%B8%D0%BD%D0%B4%D0%B5%D0%BA%D1%81.jpg" alt="Афиша INDEX"></div>
        <div class="concert-project-copy">
          <div class="concert-project-title"><h2>INDEX</h2><span>↗</span></div>
          
        </div>
      </a>
    </section>
  </main>
  <footer class="case-footer"><a class="wordmark" href="index.html">VICE<span>.</span></a><a href="index.html#works">← К ПРОЕКТАМ</a></footer>
  <script src="script.js"></script>
</body>
</html>
