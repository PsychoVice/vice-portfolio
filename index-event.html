<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101012">
  <meta name="description" content="VICE — фотографии с INDEX.">
  <title>VICE — INDEX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261118-10">
  <style>
    .event-page{padding:7vw 8vw 9vw;min-height:calc(100svh - 100px)}
    .event-back{display:inline-flex;color:#aaa5a2;font-size:10px;font-weight:800;letter-spacing:.14em}
    .event-kicker{margin-top:90px;color:#bd5267;font-size:10px;font-weight:800;letter-spacing:.2em}
    .event-title{margin:20px 0;font:500 clamp(58px,10vw,132px)/.95 var(--display);text-transform:uppercase}
    .event-meta{display:flex;gap:30px;flex-wrap:wrap;margin-top:42px;padding:20px 0;border-top:1px solid rgba(255,255,255,.16);border-bottom:1px solid rgba(255,255,255,.16);color:#aaa5a2;font-size:9px;letter-spacing:.16em}
    .event-gallery{margin:58px auto 0;max-width:1450px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-rows:repeat(3,auto);gap:14px 18px;align-items:stretch}
    .event-photo-wrap{overflow:hidden;background:#141416;line-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
    .event-photo{display:block;width:100%;height:auto;aspect-ratio:auto;object-fit:contain;transition:transform .5s ease,filter .5s ease;cursor:zoom-in}
    .event-photo-wrap:nth-child(1){grid-column:1;grid-row:1 / span 3}
    .event-photo-wrap:nth-child(1) .event-photo{width:100%;height:auto;max-height:100%;object-fit:contain}
    .event-photo-wrap:nth-child(2){grid-column:2;grid-row:1}
    .event-photo-wrap:nth-child(3){grid-column:2;grid-row:2}
    .event-photo-wrap:nth-child(4){grid-column:2;grid-row:3}
    .event-photo-wrap:hover .event-photo{transform:scale(1.015);filter:brightness(1.06)}
    .photo-lightbox{width:100vw;height:100vh;max-width:none;max-height:none;padding:5vh 5vw;margin:0;border:0;background:rgba(5,5,7,.94);color:white;overflow:hidden}
    .photo-lightbox[open]{display:flex;align-items:center;justify-content:center}
    .photo-lightbox::backdrop{background:rgba(5,5,7,.94)}
    .photo-lightbox img{display:block;max-width:90vw;max-height:90vh;width:auto;height:auto;object-fit:contain}
    .lightbox-close{position:fixed;top:22px;right:28px;width:44px;height:44px;border:1px solid rgba(255,255,255,.45);border-radius:50%;background:rgba(15,15,17,.65);color:#fff;font:300 30px/1 Arial;cursor:pointer}
    .event-footer{margin:0 8vw 30px;padding-top:20px;border-top:1px solid rgba(255,255,255,.16);display:flex;justify-content:space-between;color:#aaa5a2;font-size:9px;letter-spacing:.14em}
    @media(max-width:650px){
      .event-page{padding:8vw 7vw 15vw}
      .event-kicker{margin-top:75px}
      .event-gallery{grid-template-columns:1fr;grid-template-rows:auto;gap:14px}
      .event-photo-wrap:nth-child(1),.event-photo-wrap:nth-child(2),.event-photo-wrap:nth-child(3),.event-photo-wrap:nth-child(4){grid-column:auto;grid-row:auto}
      .event-photo-wrap:nth-child(1) .event-photo{height:auto;max-height:620px;aspect-ratio:auto;object-fit:contain}
      .photo-lightbox{padding:4vh 3vw}
      .photo-lightbox img{max-width:94vw;max-height:88vh}
      .lightbox-close{top:14px;right:14px}
      .event-footer{margin-left:7vw;margin-right:7vw}
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="VICE — на главную"><img class="site-logo" src="images/%D0%BB%D0%BE%D0%B3%D0%BE%20%D0%B1%D0%B5%D0%B7%20%D1%84%D0%BE%D0%BD%D0%B0.png" alt="VICE"></a>
  </header>
  <main class="event-page">
    <a class="event-back" href="concerts.html">← НАЗАД К КОНЦЕРТНЫМ ПРОЕКТАМ</a>
    <div class="event-kicker">LIVE PHOTOGRAPHY / 02</div>
    <h1 class="event-title">INDEX</h1>
    <div class="event-meta"><span>VICE — PHOTOGRAPHY</span><span>LIVE / EVENT</span></div>
    <section class="event-gallery" aria-label="Фотографии INDEX">
      <div class="event-photo-wrap"><img class="event-photo" src="images/projects/concerts/INDEX/DFF%20index%20001.png" alt="INDEX — концертная фотография 1" loading="lazy"></div>
      <div class="event-photo-wrap"><img class="event-photo" src="images/projects/concerts/INDEX/DFF%20index%20002.png" alt="INDEX — концертная фотография 2" loading="lazy"></div>
      <div class="event-photo-wrap"><img class="event-photo" src="images/projects/concerts/INDEX/DFF%20index%20003.png" alt="INDEX — концертная фотография 3" loading="lazy"></div>
      <div class="event-photo-wrap"><img class="event-photo" src="images/projects/concerts/INDEX/DFF%20index%20004.png" alt="INDEX — концертная фотография 4" loading="lazy"></div>
    </section>
  </main>
  <dialog class="photo-lightbox" aria-label="Увеличенная фотография">
    <button class="lightbox-close" type="button" aria-label="Закрыть">×</button>
    <img src="" alt="">
  </dialog>
  <footer class="event-footer"><a href="index.html">VICE.</a><a href="concerts.html">← К КОНЦЕРТАМ</a></footer>
  <script>
    const lightbox = document.querySelector('.photo-lightbox');
    const lightboxImage = lightbox.querySelector('img');
    document.querySelectorAll('.event-photo').forEach(photo => {
      photo.addEventListener('click', () => {
        lightboxImage.src = photo.src;
        lightboxImage.alt = photo.alt;
        lightbox.showModal();
      });
    });
    lightbox.querySelector('.lightbox-close').addEventListener('click', () => lightbox.close());
    lightbox.addEventListener('click', event => {
      if (event.target === lightbox) lightbox.close();
    });
    lightbox.addEventListener('close', () => {
      lightboxImage.src = '';
      lightboxImage.alt = '';
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
